name: Deploy Spring Boot to Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  IMAGE: survivor-outdraft-backend

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SHA_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${SHA_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS }}
        run: |
          cat > cloudrun-env.yaml <<EOF
          SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
          SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
          SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
          JWT_SECRET: "${JWT_SECRET}"
          VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS: "${VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS}"
          EOF

          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --env-vars-file cloudrun-env.yaml \
            --quiet
