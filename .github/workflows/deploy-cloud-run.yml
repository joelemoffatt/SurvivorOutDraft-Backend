name: Deploy Spring Boot to Cloud Run

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  IMAGE: survivor-outdraft-backend

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Validate required deploy inputs
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
          SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS }}
        run: |
          missing=0
          for key in PROJECT_ID REGION REPOSITORY SERVICE SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD JWT_SECRET VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret/value: $key"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "Deploy target: project=$PROJECT_ID region=$REGION service=$SERVICE repo=$REPOSITORY"

      - name: Validate Artifact Registry repository
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" --location "$REGION" --project "$PROJECT_ID" --format='value(name)'

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SHA_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${SHA_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        continue-on-error: true
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS }}
        run: |
          cat > cloudrun-env.yaml <<EOF
          SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
          SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
          SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
          JWT_SECRET: "${JWT_SECRET}"
          VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS: "${VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS}"
          EOF

          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --env-vars-file cloudrun-env.yaml \
            --quiet

      - name: Show Cloud Run error logs on deploy failure
        if: steps.deploy.outcome == 'failure'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          REVISION="$(gcloud run revisions list \
            --service "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --sort-by=~metadata.creationTimestamp \
            --limit=1 \
            --format='value(metadata.name)')"

          echo "Latest revision: ${REVISION}"
          echo "Recent ERROR logs from that revision:"

          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND resource.labels.revision_name=${REVISION} AND severity>=ERROR" \
            --project "${PROJECT_ID}" \
            --limit=50 \
            --format='value(timestamp,textPayload,jsonPayload.message)'

          exit 1
