spring.application.name=survivor-out-draft
server.port=${PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soddb?reWriteBatchedInserts=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=250
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.web.error.include-message=always

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Logging
logging.level.com.vivida.auth.JwtAuthenticationFilter=INFO

# CORS Configuration
# Comma-separated origin patterns used by CorsConfig.allowedOriginPatterns(...)
# Add your LAN dev host here when needed, e.g. http://192.168.86.20:8081
vivida.cors.allowed-origin-patterns=${VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*}

# DataLoader Configuration
# Disabled by default so production boots do not truncate and reseed data.
# Enable explicitly in local/dev environments when you want seed data loaded.
vivida.dataloader.enabled=${VIVIDA_DATALOADER_ENABLED:false}
vivida.dataloader.load-game-data=${VIVIDA_DATALOADER_LOAD_GAME_DATA:false}
vivida.dataloader.load-users=${VIVIDA_DATALOADER_LOAD_USERS:false}
vivida.dataloader.load-groups=${VIVIDA_DATALOADER_LOAD_GROUPS:false}
# Set to true to append only new records (from delta/ folder) instead of wiping and reloading everything.
vivida.dataloader.incremental=${VIVIDA_DATALOADER_INCREMENTAL:false}