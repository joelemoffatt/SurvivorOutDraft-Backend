spring.application.name=survivor-out-draft

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.web.error.include-message=always

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Logging
logging.level.com.vivida.auth.JwtAuthenticationFilter=INFO

# CORS Configuration
# Comma-separated origin patterns used by CorsConfig.allowedOriginPatterns(...)
# Add your LAN dev host here when needed, e.g. http://192.168.86.20:8081
vivida.cors.allowed-origin-patterns=${VIVIDA_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*}

# DataLoader Configuration
vivida.dataloader.enabled=true
vivida.dataloader.load-game-data=false
vivida.dataloader.load-users=false
vivida.dataloader.load-groups=true